# Publica una versión de Ant en GitHub Releases al empujar una etiqueta `vX.Y.Z`.
# Compila en cada sistema (Tauri no compila para otro sistema desde macOS):
#   - macOS: .dmg universal (Apple Silicon e Intel)
#   - Windows: instalador .exe (NSIS) y .msi
#   - Linux: .AppImage, .deb y .rpm
# La versión se crea como borrador con las notas de CHANGELOG.md (escrito en inglés) y se
# publica solo si compilaron los tres sistemas.
name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  borrador:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.crear.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Revisar la versión y crear el borrador
        id: crear
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for archivo in package.json src-tauri/tauri.conf.json; do
            v=$(jq -r .version "$archivo")
            [ "$v" = "$version" ] || { echo "::error::$archivo dice $v, la etiqueta dice $version"; exit 1; }
          done
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml \
            || { echo "::error::src-tauri/Cargo.toml no tiene la versión $version"; exit 1; }
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { dentro = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { dentro = 0 }
            dentro
          ' CHANGELOG.md > notas.md
          grep -q '[^[:space:]]' notas.md \
            || { echo "::error::CHANGELOG.md no tiene una sección para $version"; exit 1; }
          # La API devuelve el id del borrador al crearlo; tauri-action sube los archivos ahí.
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Ant $version" -F body=@notas.md \
            -F draft=true --jq .id)
          [ -n "$id" ] || { echo "::error::No se pudo crear el borrador"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  compilar:
    needs: borrador
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: macos-latest
            args: --target universal-apple-darwin
          - sistema: windows-latest
            args: ''
          - sistema: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Las pruebas automáticas (lógica de la interfaz y Rust) corren una vez, en Linux: si
      # fallan, no se publica la versión.
      - name: Pruebas
        if: runner.os == 'Linux'
        run: |
          pnpm test
          cd src-tauri && cargo test

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.borrador.outputs.id }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: false

  publicar:
    needs: [borrador, compilar]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar la versión (si tiene los archivos de los tres sistemas)
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.borrador.outputs.id }}
        run: |
          archivos=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.assets[].name')
          echo "$archivos"
          for ext in .dmg .exe .msi .AppImage .deb .rpm; do
            grep -qF "$ext" <<< "$archivos" || { echo "::error::Falta el archivo $ext"; exit 1; }
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true --jq .html_url
